version: 1.1
kind: component
name: speculative-decoding-study
inputs:
  - name: mode
    type: str
    value: baseline
termination:
  timeout: 7200
plugins:
  shm: true
run:
  kind: service
  ports: [8000]
  rewritePath: true
  container:
    image: vllm/vllm-openai@sha256:2c908d5a84ed251b6a17d179f42d06df1aff353007779ac5eecd8a0ea3fe9331
    workingDir: "{{ globals.run_artifacts_path }}/uploads"
    command: [python, start_server.py]
    args: [--mode, "{{ mode }}"]
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
    resources:
      requests:
        cpu: "4"
        memory: 12Gi
        nvidia.com/gpu: 1
      limits:
        cpu: "8"
        memory: 24Gi
        nvidia.com/gpu: 1
