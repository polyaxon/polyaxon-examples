version: 1.1
kind: component
name: invoice-extractor
termination:
  timeout: 7200
plugins:
  shm: true
run:
  kind: service
  ports: [8000]
  rewritePath: true
  container:
    image: vllm/vllm-openai@sha256:2c908d5a84ed251b6a17d179f42d06df1aff353007779ac5eecd8a0ea3fe9331
    command: [vllm, serve]
    args:
      - Qwen/Qwen2.5-VL-7B-Instruct
      - --revision
      - cc594898137f460bfe9f0759e9844b3ce807cfb5
      - --tokenizer-revision
      - cc594898137f460bfe9f0759e9844b3ce807cfb5
      - --served-model-name
      - invoice-extractor
      - --max-model-len
      - "4096"
      - --max-num-seqs
      - "2"
      - --limit-mm-per-prompt
      - '{"image": 1}'
      - --gpu-memory-utilization
      - "0.85"
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      periodSeconds: 10
    resources:
      requests:
        cpu: "4"
        memory: 16Gi
        nvidia.com/gpu: 1
      limits:
        cpu: "8"
        memory: 32Gi
        nvidia.com/gpu: 1
